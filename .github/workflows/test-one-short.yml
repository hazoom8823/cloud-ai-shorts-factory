name: Test One AI Short (Free)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الريلز بالعربي"
        required: true
        type: string
        default: "قصة ملهمة قصيرة عن شخص تجاهله الجميع ثم فاجأهم"

permissions:
  contents: read

jobs:
  create-one-short:
    name: Create one vertical short
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install free Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests edge-tts

      - name: Generate a single test video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
        run: |
          cat > /tmp/create_short.py <<'AI_SHORTS_SCRIPT'
          import html
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import time
          from pathlib import Path
          from urllib.parse import urlparse
          
          import requests
          
          OUT = Path("output")
          ASSETS = OUT / "assets"
          OUT.mkdir(exist_ok=True)
          ASSETS.mkdir(exist_ok=True)
          API_KEY = os.getenv("GEMINI_API_KEY", "").strip()
          TOPIC = os.getenv("TOPIC", "قصة ملهمة قصيرة عن شخص تجاهله الجميع ثم فاجأهم").strip()
          USER_AGENT = "CloudAIShortsFactory/1.0 (https://github.com/hazoom8823/cloud-ai-shorts-factory)"
          HEADERS = {"User-Agent": USER_AGENT}
          MAX_VIDEO_BYTES = 35 * 1024 * 1024
          
          if not API_KEY:
              raise SystemExit("ERROR: Secret GEMINI_API_KEY is missing. Add it in Settings > Secrets and variables > Actions.")
          
          
          def clean_html(value):
              if isinstance(value, dict):
                  value = value.get("value", "")
              value = re.sub(r"<[^>]+>", " ", str(value or ""))
              return re.sub(r"\s+", " ", html.unescape(value)).strip()
          
          
          def generate_story(topic):
              prompt = f"""أنت كاتب ومخرج Reels محترف. اكتب قصة قصيرة أصلية لفيديو عمودي مدته نحو 35-45 ثانية.
          الموضوع: {topic}
          المطلوب: عربي مصري بسيط وطبيعي، بداية تشد الانتباه خلال أول ثانيتين، تصاعد واضح، ونهاية مرضية أو مفاجأة صغيرة. لا تدّعِ أن قصة خيالية حدثت فعلًا. لو الموضوع علمي/تاريخي، تجنب الادعاءات التي لا تعرفها.
          أخرج JSON فقط بهذا الشكل الدقيق:
          {{
           "title":"عنوان عربي قصير وجذاب لا يتجاوز 8 كلمات",
           "narration":"نص الراوي كاملًا، 75 إلى 100 كلمة، بلا عناوين أو إيموجي",
           "description":"وصف عربي قصير مناسب ليوتيوب مع 3 إلى 5 هاشتاجات",
           "scenes":[
            {{"query":"English Wikimedia Commons video search terms, 2-5 words","caption":"وصف قصير جدًا للمشهد بالعربية"}},
            {{"query":"...","caption":"..."}},
            {{"query":"...","caption":"..."}},
            {{"query":"...","caption":"..."}},
            {{"query":"...","caption":"..."}}
           ]
          }}
          كل مشهد لازم يكون له كلمة بحث إنجليزية قابلة للعثور على فيديو stock واقعي مجاني. لا تضف أي نص خارج JSON."""
              payload = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {"temperature": 0.8, "responseMimeType": "application/json"},
              }
              errors = []
              for model in ("gemini-3.8-flash", "gemini-2.5-flash"):
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
                  try:
                      response = requests.post(url, params={"key": API_KEY}, json=payload, timeout=120)
                      if response.status_code >= 400:
                          errors.append(f"{model}: HTTP {response.status_code} — {response.text[:250]}")
                          if response.status_code not in (400, 404, 429, 500, 503):
                              break
                          continue
                      data = response.json()
                      text = data["candidates"][0]["content"]["parts"][0]["text"].strip()
                      text = re.sub(r"^```(?:json)?\s*|\s*```$", "", text, flags=re.I)
                      story = json.loads(text)
                      story["title"] = str(story.get("title", "قصة قصيرة تستحق المشاهدة"))[:90]
                      story["narration"] = str(story.get("narration", "")).strip()
                      story["description"] = str(story.get("description", "")).strip()
                      scenes = story.get("scenes", [])
                      if len(story["narration"]) < 120 or not isinstance(scenes, list) or len(scenes) < 3:
                          raise ValueError("Gemini returned incomplete narration/scenes; try running again.")
                      while len(scenes) < 5:
                          scenes.append({"query": "nature landscape", "caption": "لقطة من القصة"})
                      story["scenes"] = scenes[:5]
                      story["model"] = model
                      return story
                  except Exception as exc:
                      errors.append(f"{model}: {type(exc).__name__}: {str(exc)[:250]}")
              raise RuntimeError("Gemini could not create the story. Check the free-tier API key/quota. Details: " + " | ".join(errors))
          
          
          def search_commons_video(query):
              params = {
                  "action": "query", "format": "json", "generator": "search",
                  "gsrsearch": f"{query} filetype:video", "gsrnamespace": 6, "gsrlimit": 12,
                  "prop": "imageinfo", "iiprop": "url|extmetadata",
              }
              resp = requests.get("https://commons.wikimedia.org/w/api.php", params=params,
                                   headers=HEADERS, timeout=35)
              resp.raise_for_status()
              pages = resp.json().get("query", {}).get("pages", {})
              results = []
              allowed = (".mp4", ".webm", ".ogv", ".ogg", ".mov", ".m4v")
              for page in pages.values():
                  title = page.get("title", "")
                  info = (page.get("imageinfo") or [{}])[0]
                  url = info.get("url", "")
                  if url and urlparse(url).path.lower().endswith(allowed):
                      meta = info.get("extmetadata", {})
                      results.append({
                          "title": title,
                          "url": url,
                          "description": clean_html(meta.get("ImageDescription", "")),
                          "artist": clean_html(meta.get("Artist", "")) or clean_html(meta.get("Credit", "")) or "Unknown",
                          "license": clean_html(meta.get("LicenseShortName", "")) or "See source page",
                          "license_url": clean_html(meta.get("LicenseUrl", "")),
                          "source_page": info.get("descriptionurl", "https://commons.wikimedia.org/"),
                      })
              return results
          
          
          def download_commons_video(scene, index, used_titles):
              requested = str(scene.get("query", "nature landscape")).strip() or "nature landscape"
              backup_queries = [requested, "nature landscape video", "ocean waves video", "forest wildlife video", "city timelapse video"]
              seen_queries = set()
              for query in backup_queries:
                  if query.lower() in seen_queries:
                      continue
                  seen_queries.add(query.lower())
                  try:
                      candidates = search_commons_video(query)
                  except Exception as exc:
                      print(f"Commons search warning for {query!r}: {type(exc).__name__}")
                      continue
                  for item in candidates:
                      if item["title"] in used_titles:
                          continue
                      path = ASSETS / f"scene_{index:02d}{Path(urlparse(item['url']).path).suffix.lower()}"
                      try:
                          with requests.get(item["url"], headers=HEADERS, stream=True, timeout=(20, 60)) as r:
                              r.raise_for_status()
                              length = r.headers.get("content-length")
                              if length and int(length) > MAX_VIDEO_BYTES:
                                  print(f"Skipping oversized Commons clip: {item['title']}")
                                  continue
                              total = 0
                              with path.open("wb") as f:
                                  for chunk in r.iter_content(1024 * 1024):
                                      if not chunk:
                                          continue
                                      total += len(chunk)
                                      if total > MAX_VIDEO_BYTES:
                                          break
                                      f.write(chunk)
                              if total > MAX_VIDEO_BYTES or total < 50_000:
                                  path.unlink(missing_ok=True)
                                  continue
                          # Confirm FFmpeg can read the downloaded file.
                          check = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration",
                                                  "-of", "default=noprint_wrappers=1:nokey=1", str(path)],
                                                 capture_output=True, text=True)
                          if check.returncode != 0 or not check.stdout.strip():
                              path.unlink(missing_ok=True)
                              continue
                          item["local_path"] = str(path)
                          used_titles.add(item["title"])
                          return item
                      except Exception as exc:
                          path.unlink(missing_ok=True)
                          print(f"Skipping clip candidate: {type(exc).__name__}")
              return None
          
          
          def run(cmd):
              print("RUN:", " ".join(str(part) for part in cmd[:6]), "...")
              subprocess.run(cmd, check=True)
          
          
          def duration_seconds(path):
              result = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration",
                                       "-of", "default=noprint_wrappers=1:nokey=1", str(path)],
                                      capture_output=True, text=True, check=True)
              return max(1.0, float(result.stdout.strip()))
          
          
          def main():
              print("1/6 — Gemini is writing the story and scene plan...")
              story = generate_story(TOPIC)
              (OUT / "story.json").write_text(json.dumps(story, ensure_ascii=False, indent=2), encoding="utf-8")
              (OUT / "script_ar.txt").write_text(story["narration"] + "\n", encoding="utf-8")
              print("Title:", story["title"])
              print("Gemini model:", story["model"])
          
              print("2/6 — Creating Egyptian Arabic narration and timed captions...")
              voice_path = OUT / "narration.mp3"
              captions_path = OUT / "captions.srt"
              tts_cmd = ["edge-tts", "--voice", "ar-EG-SalmaNeural", "--rate=+4%",
                         "--text", story["narration"], "--write-media", str(voice_path), "--write-subtitles", str(captions_path)]
              run(tts_cmd)
              if not voice_path.exists() or voice_path.stat().st_size < 10_000:
                  raise RuntimeError("Arabic narration generation did not produce an audio file.")
              audio_duration = duration_seconds(voice_path)
          
              print("3/6 — Searching free-licensed video clips on Wikimedia Commons...")
              used_titles = set()
              clips = []
              credits = []
              for i, scene in enumerate(story["scenes"], start=1):
                  item = download_commons_video(scene, i, used_titles)
                  if item is None:
                      # Reuse a successfully downloaded clip if Commons does not provide a match.
                      if clips:
                          item = dict(clips[-1])
                          item["title"] = item["title"] + " (reused for scene " + str(i) + ")"
                          print(f"No suitable new clip found for scene {i}; reusing previous clip.")
                      else:
                          raise RuntimeError("No downloadable video clip found on Wikimedia Commons. Run again or change the topic.")
                  clips.append(item)
                  credits.append(
                      f"Scene {i}: {item.get('title','')}\n"
                      f"Creator: {item.get('artist','Unknown')}\n"
                      f"License: {item.get('license','See source page')} {item.get('license_url','')}\n"
                      f"Source: {item.get('source_page','')}\n"
                  )
                  print(f"Scene {i}/5 ready: {item.get('title','unknown')}")
          
              print("4/6 — Editing vertical 1080x1920 scenes...")
              segment_duration = audio_duration / len(clips)
              concat_file = OUT / "concat.txt"
              normalized = []
              for i, item in enumerate(clips, start=1):
                  scene_out = ASSETS / f"normalized_{i:02d}.mp4"
                  vf = "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,eq=contrast=1.06:saturation=1.12,fps=30,format=yuv420p"
                  run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-stream_loop", "-1",
                       "-i", item["local_path"], "-t", f"{segment_duration:.3f}", "-vf", vf,
                       "-an", "-c:v", "libx264", "-preset", "veryfast", "-crf", "22", "-movflags", "+faststart", str(scene_out)])
                  normalized.append(scene_out)
              concat_file.write_text("".join(f"file '{p.resolve().as_posix()}'\n" for p in normalized), encoding="utf-8")
              base_video = OUT / "video_no_audio.mp4"
              run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-f", "concat", "-safe", "0",
                   "-i", str(concat_file), "-c", "copy", str(base_video)])
          
              # Add a short Arabic title at the top; Edge TTS supplies word/phrase timing below.
              original_srt = captions_path.read_text(encoding="utf-8-sig") if captions_path.exists() else ""
              blocks = re.split(r"\n\s*\n", original_srt.strip()) if original_srt.strip() else []
              shifted_blocks = []
              for block in blocks:
                  lines = block.splitlines()
                  if lines and lines[0].strip().isdigit():
                      lines[0] = str(int(lines[0].strip()) + 1)
                  if lines:
                      shifted_blocks.append("\n".join(lines))
              title_cue = "1\n00:00:00,300 --> 00:00:02,800\n{\\an8\\fs42\\bord3\\shad2}" + story["title"].replace("\n", " ")
              all_srt = title_cue + "\n\n" + "\n\n".join(shifted_blocks) + "\n"
              caption_file = OUT / "final_captions.srt"
              caption_file.write_text(all_srt, encoding="utf-8")
          
              print("5/6 — Rendering captions and Arabic voice-over...")
              final_video = OUT / "AI_Short_Test.mp4"
              subtitle_filter = "subtitles=output/final_captions.srt:force_style='FontName=Noto Sans Arabic,FontSize=27,PrimaryColour=&H00FFFFFF,OutlineColour=&H00101018,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=165'"
              run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", str(base_video), "-i", str(voice_path),
                   "-vf", subtitle_filter, "-map", "0:v:0", "-map", "1:a:0", "-c:v", "libx264", "-preset", "veryfast",
                   "-crf", "22", "-c:a", "aac", "-b:a", "160k", "-shortest", "-movflags", "+faststart", str(final_video)])
              # Generate a thumbnail from the first seconds of the final video.
              thumb = OUT / "thumbnail.jpg"
              subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-ss", "1.2", "-i", str(final_video),
                              "-frames:v", "1", "-vf", "scale=540:-1", str(thumb)], check=False)
          
              credit_text = "المشاهد المصورة مأخوذة من Wikimedia Commons. راجع بيانات المصدر والترخيص لكل مشهد أدناه.\n\n"
              credit_text += "\n".join(credits)
              credit_text += "\nرابط المكتبة: https://commons.wikimedia.org/\n"
              (OUT / "credits.txt").write_text(credit_text, encoding="utf-8")
              desc = story["description"] + "\n\nالمشاهد المصورة ومعلومات النسب والترخيص: راجع credits.txt.\n"
              (OUT / "youtube_description.txt").write_text(desc, encoding="utf-8")
              summary = {
                  "title": story["title"], "topic": TOPIC, "model": story["model"],
                  "video": final_video.name, "seconds": round(duration_seconds(final_video), 2),
                  "resolution": "1080x1920", "youtube_upload": "NOT PERFORMED — test artifact only",
                  "visual_source": "Wikimedia Commons free-licensed video files; attribution in credits.txt",
              }
              (OUT / "test_summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
              print("6/6 — SUCCESS. Video created:", final_video, "Size:", round(final_video.stat().st_size / (1024 * 1024), 2), "MB")
              print("This workflow does NOT publish to YouTube. Download the artifact from the Actions run page.")
          
          
          if __name__ == "__main__":
              main()
          AI_SHORTS_SCRIPT
          python /tmp/create_short.py

      - name: Upload video and metadata as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-short-test-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7
