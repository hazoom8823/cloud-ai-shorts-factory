name: Test One AI Short (Cinematic Free)

'on':
  workflow_dispatch:
    inputs:
      topic:
        description: "موضوع الريلز بالعربي"
        required: true
        type: string
        default: "قصة غامضة قصيرة بنهاية غير متوقعة"

permissions:
  contents: read

jobs:
  create-one-short:
    name: Create one cinematic vertical short (no YouTube upload)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install free packages
        run: python -m pip install --upgrade requests edge-tts

      - name: Create cinematic test Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TOPIC: ${{ inputs.topic }}
        run: |
          cat > /tmp/create_short.py <<'AI_SHORTS_SCRIPT'
          #!/usr/bin/env python3
          import json, os, re, subprocess, sys, time
          from pathlib import Path
          from urllib.parse import urlparse
          import requests

          OUT = Path("output")
          ASSETS = OUT / "assets"
          OUT.mkdir(exist_ok=True)
          ASSETS.mkdir(exist_ok=True)
          GEMINI_KEY = os.getenv("GEMINI_API_KEY", "").strip()
          PIXABAY_KEY = os.getenv("PIXABAY_API_KEY", "").strip()
          TOPIC = os.getenv("TOPIC", "قصة غامضة قصيرة بنهاية غير متوقعة").strip()
          SESSION = requests.Session()
          SESSION.headers.update({"User-Agent": "CloudAIShortsFactory/2.0"})
          MAX_CLIP_BYTES = 60 * 1024 * 1024

          if not GEMINI_KEY:
              raise SystemExit("Missing GitHub Secret GEMINI_API_KEY")
          if not PIXABAY_KEY:
              raise SystemExit("Missing GitHub Secret PIXABAY_API_KEY. Create a free Pixabay API key and add it in Settings > Secrets and variables > Actions.")


          def run(cmd, capture=False):
              print("RUN:", " ".join(str(x) for x in cmd[:7]), "...")
              return subprocess.run(cmd, check=True, text=capture, stdout=subprocess.PIPE if capture else None,
                                    stderr=subprocess.PIPE if capture else None)


          def media_duration(path):
              p = run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", str(path)], capture=True)
              return max(0.1, float(p.stdout.strip()))


          def request_story(topic):
              prompt = f"""أنت كاتب ومخرج Reels محترف. أنشئ قصة أصلية بالعربية المصرية الطبيعية مدتها 35-45 ثانية، من 75 إلى 95 كلمة منطوقة.
          الموضوع: {topic}
          اجعل أول ثانية Hook فضوليًا قويًا، ثم خمس لحظات بصرية متصاعدة، ثم نهاية مؤثرة أو مفاجأة منطقية. لا تقل إنها قصة حقيقية إذا كانت خيالية.
          أخرج JSON فقط بالشكل التالي:
          {{
           "title":"عنوان عربي جذاب من 4 إلى 8 كلمات",
           "hook":"جملة افتتاحية قصيرة لا تتجاوز 7 كلمات",
           "narration":"النص كاملًا باللهجة المصرية، 75-95 كلمة",
           "description":"وصف عربي مناسب للفيديو و3 هاشتاجات",
           "scenes":[
            {{"search_query":"specific English query for a real cinematic vertical video shot","caption":"جملة بصرية قصيرة بالعربية"}},
            {{"search_query":"...","caption":"..."}},
            {{"search_query":"...","caption":"..."}},
            {{"search_query":"...","caption":"..."}},
            {{"search_query":"...","caption":"..."}}
           ]
          }}
          قواعد المشاهد: ابحث عن لقطات واقعية محددة لا عن رسوم أو صور ثابتة. غيّر المكان والفعل بين كل لقطة. مثال جيد: "lonely man walking rainy city night cinematic" وليس "sad story". اجعل النص منطقيًا ومتصلاً، بلا إيموجي، ولا تذكر أفلامًا أو شخصيات محمية. لا تضف أي شيء خارج JSON."""
              errors = []
              for model in ("gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-2.5-flash"):
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
                  try:
                      response = SESSION.post(url, params={"key": GEMINI_KEY}, json={
                          "contents": [{"parts": [{"text": prompt}]}],
                          "generationConfig": {"temperature": 0.9, "responseMimeType": "application/json"}
                      }, timeout=120)
                      if not response.ok:
                          errors.append(f"{model} HTTP {response.status_code}: {response.text[:200]}")
                          continue
                      raw = response.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                      raw = re.sub(r"^```(?:json)?\s*|\s*```$", "", raw, flags=re.I)
                      plan = json.loads(raw)
                      scenes = plan.get("scenes")
                      if not isinstance(scenes, list) or len(scenes) != 5:
                          raise ValueError("Story must contain exactly five visual scenes")
                      narration = str(plan.get("narration", "")).strip()
                      words = len(narration.split())
                      if words < 65 or words > 115:
                          raise ValueError(f"Narration length unsuitable ({words} words)")
                      for i, s in enumerate(scenes):
                          for key in ("search_query", "caption"):
                              if not isinstance(s.get(key), str) or not s[key].strip():
                                  raise ValueError(f"Scene {i+1} missing {key}")
                          s["search_query"] = s["search_query"].strip()[:100]
                          s["caption"] = s["caption"].strip()[:55]
                      plan["title"] = str(plan.get("title", "قصة قصيرة مشوقة"))[:85]
                      plan["hook"] = str(plan.get("hook", plan["title"]))[:65]
                      plan["narration"] = narration
                      plan["description"] = str(plan.get("description", "قصة قصيرة بمساعدة الذكاء الاصطناعي"))
                      plan["model"] = model
                      return plan
                  except Exception as exc:
                      errors.append(f"{model}: {type(exc).__name__}: {exc}")
              raise RuntimeError("Gemini story generation failed. Check model availability/quota: " + " | ".join(errors))


          def search_pixabay(query):
              response = SESSION.get("https://pixabay.com/api/videos/", params={
                  "key": PIXABAY_KEY, "q": query, "video_type": "film", "safesearch": "true",
                  "per_page": 20, "min_width": 640, "min_height": 800, "lang": "en"
              }, timeout=60)
              if response.status_code == 429:
                  raise RuntimeError("Pixabay API rate limit reached; wait and retry")
              response.raise_for_status()
              payload = response.json()
              if "hits" not in payload:
                  raise RuntimeError("Pixabay API response did not include video hits")
              return payload.get("hits", [])


          def choose_file(video):
              variants = video.get("videos", {})
              files = []
              for quality in ("large", "medium", "small", "tiny"):
                  f = variants.get(quality) or {}
                  if f.get("url"):
                      files.append({**f, "quality": quality})
              if not files:
                  return None
              vertical = [f for f in files if int(f.get("height") or 0) >= int(f.get("width") or 0)]
              choices = vertical or files
              def score(f):
                  w, h = int(f.get("width") or 0), int(f.get("height") or 0)
                  ratio = w / h if h else 10
                  highres_penalty = 0 if h <= 1920 else (h - 1920) / 1920
                  return (abs(ratio - 9/16) + highres_penalty * 0.15, -min(h, 1920), int(f.get("size") or 0))
              best = sorted(choices, key=score)[0]
              return {**best, "link": best.get("url", "") }


          def download_scene(scene, index, used_ids):
              base = scene["search_query"]
              # Relax search wording only; never replace a missing scene with unrelated generic footage.
              tokens = base.split()
              queries = list(dict.fromkeys([base, " ".join(tokens[:4]), " ".join(tokens[:3])]))
              last_error = "no relevant results"
              for query in queries:
                  try:
                      videos = search_pixabay(query)
                      videos.sort(key=lambda v: (
                          0 if any(int((f or {}).get("height") or 0) >= int((f or {}).get("width") or 0)
                                   for f in (v.get("videos") or {}).values()) else 1,
                          -max([int((f or {}).get("height") or 0) for f in (v.get("videos") or {}).values()] or [0]),
                          -int(v.get("duration") or 0)
                      ))
                      for video in videos:
                          vid = str(video.get("id", ""))
                          if not vid or vid in used_ids:
                              continue
                          vf = choose_file(video)
                          if not vf:
                              continue
                          path = ASSETS / f"scene_{index:02d}.mp4"
                          try:
                              with SESSION.get(vf["link"], stream=True, timeout=(20, 90)) as response:
                                  response.raise_for_status()
                                  total = 0
                                  with path.open("wb") as f:
                                      for block in response.iter_content(chunk_size=1024 * 512):
                                          if not block:
                                              continue
                                          total += len(block)
                                          if total > MAX_CLIP_BYTES:
                                              raise RuntimeError("clip exceeded 60 MB limit")
                                          f.write(block)
                              if total < 50_000:
                                  raise RuntimeError("clip download was too small")
                              probe = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", str(path)], capture_output=True, text=True)
                              if probe.returncode or not probe.stdout.strip():
                                  raise RuntimeError("downloaded asset is not a valid video")
                              used_ids.add(vid)
                              return {
                                  "path": str(path), "video_id": vid,
                                  "video_page": video.get("pageURL", "https://pixabay.com/videos/"),
                                  "creator": video.get("user", "Pixabay contributor"),
                                  "creator_url": "https://pixabay.com/users/" + str(video.get("user_id", "")) + "/",
                                  "width": vf.get("width"), "height": vf.get("height"), "query": query,
                              }
                          except Exception as exc:
                              path.unlink(missing_ok=True)
                              last_error = str(exc)
                  except Exception as exc:
                      last_error = f"{type(exc).__name__}: {exc}"
                  time.sleep(0.25)
              raise RuntimeError(f"No suitable unique video found for scene {index} ({base!r}). It will NOT reuse an unrelated clip. Last detail: {last_error}")


          def ass_time(s):
              s = max(0, float(s))
              total_cs = int(round(s * 100))
              hours, total_cs = divmod(total_cs, 360000)
              minutes, total_cs = divmod(total_cs, 6000)
              seconds, cs = divmod(total_cs, 100)
              return f"{hours}:{minutes:02d}:{seconds:02d}.{cs:02d}"


          def ass_escape(t):
              return str(t).replace("\\", "\\\\").replace("{", "\\{").replace("}", "\\}").replace("\n", "\\N")


          def srt_to_ass(srt_path, plan, narration_duration):
              raw = srt_path.read_text(encoding="utf-8-sig")
              blocks = re.split(r"\n\s*\n", raw.strip()) if raw.strip() else []
              # Designed for 1080x1920. Distinct typographic hierarchy: hook top, phrase captions bottom.
              lines = [
                  "[Script Info]", "ScriptType: v4.00+", "PlayResX: 1080", "PlayResY: 1920", "WrapStyle: 2", "ScaledBorderAndShadow: yes", "",
                  "[V4+ Styles]",
                  "Format: Name,Fontname,Fontsize,PrimaryColour,SecondaryColour,OutlineColour,BackColour,Bold,Italic,Underline,StrikeOut,ScaleX,ScaleY,Spacing,Angle,BorderStyle,Outline,Shadow,Alignment,MarginL,MarginR,MarginV,Encoding",
                  "Style: Caption,Noto Sans Arabic,58,&H00FFFFFF,&H0000D7FF,&H00101018,&HBC000000,-1,0,0,0,100,100,0,0,3,3,1,2,80,80,270,1",
                  "Style: Hook,Noto Sans Arabic,82,&H0000D7FF,&H0000D7FF,&H00101018,&HAA000000,-1,0,0,0,100,100,1,0,3,4,2,8,70,70,175,1",
                  "Style: SceneTag,Noto Sans Arabic,48,&H00FFFFFF,&H0000D7FF,&H00101018,&HAA000000,-1,0,0,0,100,100,0,0,3,3,1,8,70,70,300,1",
                  "", "[Events]", "Format: Layer,Start,End,Style,Name,MarginL,MarginR,MarginV,Effect,Text"
              ]
              hook_end = min(2.9, narration_duration)
              lines.append(f"Dialogue: 3,{ass_time(0)},{ass_time(hook_end)},Hook,,0,0,0,,{{\\fad(220,250)\\fscx82\\fscy82\\t(0,260,\\fscx100\\fscy100)}}{ass_escape(plan['hook'])}")
              # Use actual speech timings generated by Edge TTS; keep phrase-sized, readable captions.
              for block in blocks:
                  parts = block.splitlines()
                  if len(parts) < 3:
                      continue
                  times = re.match(r"(\d\d):(\d\d):(\d\d)[,.](\d\d\d)\s+-->\s+(\d\d):(\d\d):(\d\d)[,.](\d\d\d)", parts[1].strip())
                  if not times:
                      continue
                  vals = [int(v) for v in times.groups()]
                  start = vals[0]*3600 + vals[1]*60 + vals[2] + vals[3]/1000
                  end = vals[4]*3600 + vals[5]*60 + vals[6] + vals[7]/1000
                  text = " ".join(parts[2:]).strip()
                  text = re.sub(r"<[^>]+>", "", text)
                  if text:
                      lines.append(f"Dialogue: 1,{ass_time(start)},{ass_time(min(end, narration_duration))},Caption,,0,0,0,,{{\\fad(70,80)}}{ass_escape(text)}")
              # Small scene labels are timed to the scene cuts, not shown as one static title for the whole film.
              span = narration_duration / max(1, len(plan["scenes"]))
              for i, scene in enumerate(plan["scenes"]):
                  if i == 0: # opening hook owns the top area during the first seconds
                      continue
                  start = i * span + 0.35
                  end = min(narration_duration, start + min(1.6, span - 0.4))
                  if end > start:
                      lines.append(f"Dialogue: 2,{ass_time(start)},{ass_time(end)},SceneTag,,0,0,0,,{{\\fad(140,180)}}{ass_escape(scene['caption'])}")
              p = OUT / "captions.ass"
              p.write_text("\n".join(lines), encoding="utf-8-sig")
              return p


          def create_video(plan, clips, audio_path, srt_path):
              voice_duration = media_duration(audio_path)
              n = len(clips)
              transition = 0.32
              segment_duration = (voice_duration + transition * (n - 1)) / n
              normalized = []
              for i, clip in enumerate(clips, 1):
                  target = ASSETS / f"graded_{i:02d}.mp4"
                  # Slight moving crop provides inexpensive camera drift without expensive per-pixel zoom animation.
                  dur_expr = f"{segment_duration:.3f}"
                  if i % 2:
                      pan_x = f"(in_w-out_w)*min(t/{dur_expr},1)"
                  else:
                      pan_x = f"(in_w-out_w)*(1-min(t/{dur_expr},1))"
                  pan_y = f"(in_h-out_h)*min(t/{dur_expr},1)"
                  vf = (
                      "fps=30,scale=1160:2062:force_original_aspect_ratio=increase,"
                      f"crop=1080:1920:x='{pan_x}':y='{pan_y}',"
                      "setsar=1,eq=contrast=1.08:saturation=1.13:brightness=-0.008,"
                      "unsharp=3:3:0.3:3:3:0.0,vignette=PI/5,format=yuv420p"
                  )
                  run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-stream_loop", "-1", "-i", clip["path"],
                       "-t", f"{segment_duration:.3f}", "-vf", vf, "-an", "-c:v", "libx264", "-preset", "ultrafast",
                       "-crf", "19", "-pix_fmt", "yuv420p", "-r", "30", str(target)])
                  normalized.append(target)
              cmd = ["ffmpeg", "-hide_banner", "-loglevel", "error", "-y"]
              for p in normalized:
                  cmd += ["-i", str(p)]
              filters = []
              for i in range(n):
                  filters.append(f"[{i}:v]settb=AVTB,setpts=PTS-STARTPTS,fps=30,format=yuv420p[v{i}]")
              prev = "v0"
              for i in range(1, n):
                  label = f"x{i}"
                  offset = i * (segment_duration - transition)
                  filters.append(f"[{prev}][v{i}]xfade=transition=fadeblack:duration={transition:.3f}:offset={offset:.3f}[{label}]")
                  prev = label
              silent = OUT / "visual_edit.mp4"
              cmd += ["-filter_complex", ";".join(filters), "-map", f"[{prev}]", "-t", f"{voice_duration:.3f}",
                      "-c:v", "libx264", "-preset", "ultrafast", "-crf", "19", "-pix_fmt", "yuv420p", "-an", str(silent)]
              run(cmd)
              ass = srt_to_ass(srt_path, plan, voice_duration)
              final = OUT / "AI_Short_Test.mp4"
              run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", str(silent), "-i", str(audio_path),
                   "-vf", f"subtitles={ass.as_posix()}", "-map", "0:v:0", "-map", "1:a:0",
                   "-af", "loudnorm=I=-16:TP=-1.5:LRA=11", "-c:v", "libx264", "-preset", "ultrafast", "-crf", "19",
                   "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "160k", "-shortest", "-movflags", "+faststart", str(final)])
              if not final.exists() or final.stat().st_size < 500_000:
                  raise RuntimeError("Final MP4 is missing or unexpectedly small")
              return final, voice_duration


          def main():
              print("1/5 — Gemini: writing a stronger story and scene-specific shot list")
              plan = request_story(TOPIC)
              (OUT / "story.json").write_text(json.dumps(plan, ensure_ascii=False, indent=2), encoding="utf-8")
              print("Story title:", plan["title"], "| model:", plan["model"])
              print("2/5 — Egyptian Arabic voice-over and timed subtitle source")
              audio, srt = OUT / "narration.mp3", OUT / "edge_subtitles.srt"
              run([sys.executable, "-m", "edge_tts", "--voice", "ar-EG-SalmaNeural", "--rate=+2%", "--text", plan["narration"], "--write-media", str(audio), "--write-subtitles", str(srt)])
              if not audio.exists() or audio.stat().st_size < 10_000 or not srt.exists():
                  raise RuntimeError("Arabic voice/subtitles were not generated")
              print("3/5 — Pixabay: finding five unique scene-specific real video clips")
              clips, used = [], set()
              for i, scene in enumerate(plan["scenes"], 1):
                  print(f"Scene {i}/5 query: {scene['search_query']}")
                  clips.append(download_scene(scene, i, used))
              (OUT / "sources.json").write_text(json.dumps([
                  {"scene": i+1, "query": x["query"], "url": x["video_page"], "creator": x["creator"], "creator_url": x["creator_url"], "width": x["width"], "height": x["height"]}
                  for i, x in enumerate(clips)], ensure_ascii=False, indent=2), encoding="utf-8")
              credits = ["Visual clips from Pixabay. This is a stock-footage montage; actual footage is not generated from scratch.\n"]
              credits += [f"Scene {i+1}: {x['video_page']}\nCreator: {x['creator']} — {x['creator_url']}\nSearch: {x['query']}\n" for i, x in enumerate(clips)]
              (OUT / "credits.txt").write_text("\n".join(credits), encoding="utf-8")
              print("4/5 — Editing 1080x1920 with motion, cinematic grade, fade-black transitions and styled Arabic captions")
              final, duration = create_video(plan, clips, audio, srt)
              run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-ss", "1.0", "-i", str(final), "-frames:v", "1", "-vf", "scale=540:-1", str(OUT / "thumbnail.jpg")])
              summary = {"title": plan["title"], "duration_seconds": round(duration, 2), "resolution": "1080x1920", "fps": 30,
                         "unique_video_clips": len(used), "visuals": "Pixabay stock footage selected per scene; not text-to-video generated",
                         "youtube_upload": "NOT PERFORMED — test only", "notes": "Check the MP4 before considering public upload."}
              (OUT / "test_summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
              print("5/5 — SUCCESS:", final, f"({final.stat().st_size/1024/1024:.1f} MB, {duration:.1f}s)")
              print("No YouTube upload was attempted. Download artifact ai-short-test-<run_number>.")

          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  print(f"WORKFLOW FAILED: {type(exc).__name__}: {exc}", file=sys.stderr)
                  raise
          AI_SHORTS_SCRIPT
          python /tmp/create_short.py

      - name: Upload MP4, thumbnail and source credits as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-short-cinematic-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7
